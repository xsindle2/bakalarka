services:
  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: zuj-name_db
      DB_USER: student
      DB_PASS: heslo123
    volumes:
      - ./tabulky:/app/tabulky:ro

  aktualizace:
    profiles: [aktualizace]
    build: .
    command: [python, -u, pomocne-scripty/planovat_aktualizace.py]
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: zuj-name_db
      DB_USER: student
      DB_PASS: heslo123
    volumes:
      - ./tabulky:/app/tabulky
      - ./tabulky_nove:/app/tabulky_nove
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: zuj-name_db
      POSTGRES_USER: student
      POSTGRES_PASSWORD: heslo123
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
